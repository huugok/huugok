<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc">
  <title id="title">huugok — GitHub profile</title>
  <desc id="desc">A dark, terminal-inspired profile banner introducing huugok, interests in software engineering and applied AI, current explorations, selected projects and contact links.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b16"/>
      <stop offset="0.55" stop-color="#111126"/>
      <stop offset="1" stop-color="#090d18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9aa4c7" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="690" rx="24" fill="url(#bg)"/>
  <rect width="1000" height="690" rx="24" fill="url(#grid)"/>
  <circle cx="880" cy="90" r="170" fill="#7c3aed" opacity=".10" filter="url(#glow)"/>
  <circle cx="120" cy="620" r="190" fill="#0284c7" opacity=".08" filter="url(#glow)"/>

  <!-- window chrome -->
  <rect x="34" y="28" width="932" height="634" rx="17" fill="#0b1020" fill-opacity=".76" stroke="#34314f" stroke-width="1.3"/>
  <path d="M34 75H966" stroke="#34314f"/>
  <circle cx="61" cy="52" r="5" fill="#fb7185"/>
  <circle cx="80" cy="52" r="5" fill="#fbbf24"/>
  <circle cx="99" cy="52" r="5" fill="#4ade80"/>
  <text x="500" y="57" text-anchor="middle" fill="#7f8aa8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">~/profile/README.md</text>

  <!-- intro -->
  <text x="72" y="125" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">HELLO, WORLD — I'M</text>
  <text x="68" y="190" fill="#f4f4fb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="58" font-weight="700">huugok<tspan fill="#a78bfa">_</tspan></text>
  <rect x="72" y="211" width="72" height="4" rx="2" fill="url(#accent)"/>
  <text x="72" y="255" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600">Building stuff, breaking stuff,</text>
  <text x="72" y="286" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600">sometimes even learning stuff.</text>
  <text x="72" y="326" fill="#aab3ca" font-family="Inter, Arial, sans-serif" font-size="16">Interested in software engineering, backend systems and applied AI.</text>
  <text x="72" y="351" fill="#aab3ca" font-family="Inter, Arial, sans-serif" font-size="16">Lately exploring LLMs, RAG architectures and the engineering</text>
  <text x="72" y="376" fill="#aab3ca" font-family="Inter, Arial, sans-serif" font-size="16">behind making AI systems actually useful.</text>

  <!-- side terminal card -->
  <rect x="690" y="111" width="230" height="255" rx="12" fill="#10172a" stroke="#343c5b"/>
  <text x="712" y="143" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">$ whoami</text>
  <text x="712" y="177" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">software_dev</text>
  <text x="712" y="211" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">$ status</text>
  <text x="712" y="245" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">curious</text>
  <text x="712" y="269" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">building</text>
  <text x="712" y="293" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">debugging</text>
  <text x="712" y="337" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">exit status: probably 0</text>

  <!-- currently exploring -->
  <path d="M72 412H928" stroke="#303751"/>
  <text x="72" y="447" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.6">01 / CURRENTLY EXPLORING</text>
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="72" y="466" width="112" height="34" rx="17" fill="#211b3d" stroke="#7653c7"/>
    <text x="128" y="488" fill="#d8ccff" text-anchor="middle">LLMs</text>
    <rect x="196" y="466" width="112" height="34" rx="17" fill="#14263b" stroke="#286a9b"/>
    <text x="252" y="488" fill="#b9e5ff" text-anchor="middle">RAG</text>
    <rect x="320" y="466" width="150" height="34" rx="17" fill="#14263b" stroke="#286a9b"/>
    <text x="395" y="488" fill="#b9e5ff" text-anchor="middle">Backend</text>
    <rect x="482" y="466" width="206" height="34" rx="17" fill="#211b3d" stroke="#7653c7"/>
    <text x="585" y="488" fill="#d8ccff" text-anchor="middle">Software architecture</text>
  </g>

  <!-- projects -->
  <text x="72" y="548" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.6">02 / SELECTED PROJECTS</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="72" y="566" width="198" height="65" rx="9" fill="#121a2b" stroke="#34405d"/>
    <text x="88" y="592" fill="#f1f5f9" font-size="15" font-weight="700">NatureMaps</text>
    <text x="88" y="613" fill="#91a0bb" font-size="12">Full-stack application</text>

    <rect x="284" y="566" width="198" height="65" rx="9" fill="#121a2b" stroke="#34405d"/>
    <text x="300" y="592" fill="#f1f5f9" font-size="15" font-weight="700">MindCheck</text>
    <text x="300" y="613" fill="#91a0bb" font-size="12">Applied AI project</text>

    <rect x="496" y="566" width="198" height="65" rx="9" fill="#121a2b" stroke="#34405d"/>
    <text x="512" y="592" fill="#f1f5f9" font-size="15" font-weight="700">RAG Evaluation</text>
    <text x="512" y="613" fill="#91a0bb" font-size="12">Developer tooling</text>

    <rect x="708" y="566" width="220" height="65" rx="9" fill="#121a2b" stroke="#34405d"/>
    <text x="724" y="592" fill="#f1f5f9" font-size="15" font-weight="700">Competitive Programming</text>
    <text x="724" y="613" fill="#91a0bb" font-size="12">Algorithms &amp; C++</text>
  </g>

  <text x="500" y="648" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">still figuring things out · usually with a terminal open</text>
</svg>
