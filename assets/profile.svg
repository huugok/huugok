<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Hugo Catalán Pastor — GitHub profile</title>
  <desc id="desc">A dark, terminal-inspired profile banner for Hugo Catalán Pastor: AI Software Intern, interested in software engineering and applied AI, current explorations and contact links.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040113"/>
      <stop offset="0.55" stop-color="#120a45"/>
      <stop offset="1" stop-color="#050218"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b35cd"/>
      <stop offset="1" stop-color="#8f99f9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8f99f9" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="name" x1="68" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2f3fb"/>
      <stop offset="1" stop-color="#5f68b4"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="620" rx="24" fill="url(#bg)"/>
  <rect width="1000" height="620" rx="24" fill="url(#grid)"/>
  <circle cx="880" cy="90" r="170" fill="#2519a1" opacity=".18" filter="url(#glow)"/>
  <circle cx="120" cy="560" r="190" fill="#3749e2" opacity=".14" filter="url(#glow)"/>

  <!-- window chrome -->
  <rect x="34" y="28" width="932" height="564" rx="17" fill="#0b0733" fill-opacity=".76" stroke="#2e2a6b" stroke-width="1.3"/>
  <path d="M34 75H966" stroke="#2e2a6b"/>
  <circle cx="61" cy="52" r="5" fill="#fb7185"/>
  <circle cx="80" cy="52" r="5" fill="#fbbf24"/>
  <circle cx="99" cy="52" r="5" fill="#4ade80"/>
  <text x="500" y="57" text-anchor="middle" fill="#7a80b5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">~/profile/README.md</text>

  <!-- intro -->
  <text x="72" y="125" fill="#8f99f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">HELLO, WORLD — I'M</text>
  <text x="68" y="188" fill="url(#name)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="46" font-weight="700">Hugo Catalán Pastor</text>
  <rect x="72" y="209" width="72" height="4" rx="2" fill="url(#accent)"/>
  <text x="72" y="253" fill="#e4e7f7" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600">Building stuff, breaking stuff,</text>
  <text x="72" y="284" fill="#e4e7f7" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600">sometimes even learning stuff.</text>
  <text x="72" y="324" fill="#a9b0d8" font-family="Inter, Arial, sans-serif" font-size="16">Interested in software engineering, backend systems and applied AI.</text>
  <text x="72" y="349" fill="#a9b0d8" font-family="Inter, Arial, sans-serif" font-size="16">Lately exploring LLMs, RAG architectures and the engineering</text>
  <text x="72" y="374" fill="#a9b0d8" font-family="Inter, Arial, sans-serif" font-size="16">behind making AI systems actually useful.</text>

  <!-- side terminal card -->
  <rect x="690" y="111" width="230" height="263" rx="12" fill="#0b0733" stroke="#2e2a6b"/>
  <text x="712" y="143" fill="#8f99f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">$ whoami</text>
  <text x="712" y="177" fill="#e7eafb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">AI Software Intern</text>
  <text x="712" y="211" fill="#8f99f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">$ status</text>
  <text x="712" y="245" fill="#a9b4f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">curious</text>
  <text x="712" y="269" fill="#a9b4f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">building</text>
  <text x="712" y="293" fill="#a9b4f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">debugging</text>
  <text x="712" y="349" fill="#6b72a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">exit status: probably 0</text>

  <!-- currently exploring -->
  <path d="M72 412H928" stroke="#24204a"/>
  <text x="72" y="447" fill="#8f99f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.6">CURRENTLY EXPLORING</text>
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="72" y="466" width="112" height="34" rx="17" fill="#141046" stroke="#4a47c0"/>
    <text x="128" y="488" fill="#cbd2ff" text-anchor="middle">LLMs</text>
    <rect x="196" y="466" width="112" height="34" rx="17" fill="#141046" stroke="#4a47c0"/>
    <text x="252" y="488" fill="#cbd2ff" text-anchor="middle">RAG</text>
    <rect x="320" y="466" width="206" height="34" rx="17" fill="#141046" stroke="#4a47c0"/>
    <text x="423" y="488" fill="#cbd2ff" text-anchor="middle">Software architecture</text>
  </g>

  <text x="500" y="572" text-anchor="middle" fill="#6b72a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">still figuring things out · usually with a terminal open</text>
</svg>
